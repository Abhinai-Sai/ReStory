services:
  - type: web
    name: restory
    env: python
    buildCommand: "pip install -r requirements.txt && python scripts/setup_models.py || true"
    startCommand: "gunicorn --config gunicorn.conf.py app:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: WEB_CONCURRENCY
        value: "1"
